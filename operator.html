<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<title>Stand helper | Champion Pride</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23002D4B'/%3E%3Crect x='11' y='11' width='10' height='10' fill='%23C6A15B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/kiosk.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/operator.css">
</head>
<body class="paper">
<div class="op">
  <header class="op-top">
    <span class="eyebrow" style="margin:0;color:var(--ink)">Champion Pride &middot; Stand helper</span>
    <span class="pill wait" id="pill" style="color:var(--ink);border-color:var(--line)"><i></i><span id="pillText">Connecting</span></span>
  </header>

  <div class="failsafe" id="failsafe">
    <div><strong>Screen dead or odd?</strong> <span id="fsText">One tap puts a sample demo on the big screen.</span></div>
    <button class="btn" id="btnDemo">Switch to Demo mode</button>
  </div>

  <nav class="dots" id="dots" aria-label="Progress"></nav>

  <main class="step" id="step" tabindex="-1" aria-live="polite"></main>

  <footer class="op-nav">
    <button class="btn" id="btnBack">Back</button>
    <button class="btn" id="btnTrouble" aria-haspopup="dialog" aria-expanded="false">Troubleshooting</button>
    <button class="btn primary" id="btnNext">Next</button>
  </footer>
</div>

<div class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-card">
    <h2 id="drawerTitle" class="sub" style="font-size:26px;font-family:var(--sans)">Troubleshooting</h2>
    <div id="drawerBody"></div>
    <button class="btn primary" id="btnDrawerClose" style="margin-top:14px;width:100%">Close</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/analysis.js"></script>
<script src="js/qr.js"></script>
<script src="js/transport.js"></script>
<script src="js/card.js"></script>
<script src="js/operator.js"></script>
</body>
</html>
